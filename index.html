<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Send a Heart</title>
<style>
  :root {
    --pink: #ff6f91;
    --pink-dark: #e0507a;
    --bg1: #fff0f5;
    --bg2: #ffe3ee;
    --text: #4a2d3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    overflow: hidden;
  }
  .game {
    position: relative;
    width: 360px;
    max-width: 92vw;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 20px 40px rgba(224, 80, 122, 0.25);
    padding: 28px 24px 32px;
    text-align: center;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
    color: var(--pink-dark);
  }
  .subtitle {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-bottom: 18px;
  }
  .avatar-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 16px;
  }
  .avatar {
    width: 100%;
    height: 100%;
    transition: transform 0.25s ease;
  }
  .avatar.bounce {
    animation: bounce 0.35s ease;
  }
  @keyframes bounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .bar-bg {
    background: #ffe0ea;
    border-radius: 20px;
    height: 14px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--pink-dark));
    border-radius: 20px;
    width: 0%;
    transition: width 0.4s ease;
  }
  .stats {
    display: flex;
    justify-content: space-around;
    margin-bottom: 20px;
    font-size: 0.85rem;
  }
  .stats div span {
    display: block;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--pink-dark);
  }
  button#sendBtn {
    background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(224,80,122,0.35);
    transition: transform 0.15s ease;
  }
  button#sendBtn:active {
    transform: scale(0.94);
  }
  .msg {
    margin-top: 14px;
    min-height: 20px;
    font-size: 0.85rem;
    font-style: italic;
    color: var(--pink-dark);
  }
  .heart-fly {
    position: absolute;
    font-size: 22px;
    left: 50%;
    bottom: 10px;
    pointer-events: none;
    animation: fly 1s ease-out forwards;
  }
  @keyframes fly {
    0% { transform: translate(-50%, 0) scale(0.6); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx))) translateY(-160px) scale(1.2); opacity: 0; }
  }
  footer {
    margin-top: 18px;
    font-size: 0.7rem;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="game" id="game">
    <h1>Send a Heart 💌</h1>
    <div class="subtitle">She gets a little happier every time you send a heart</div>

    <div class="avatar-wrap">
      <svg id="avatar" class="avatar" viewBox="0 0 200 200">
        <!-- hair back -->
        <ellipse cx="100" cy="95" rx="72" ry="80" fill="#5b3a29"/>
        <!-- face -->
        <ellipse cx="100" cy="105" rx="58" ry="62" fill="#ffe0c2"/>
        <!-- yanaklar -->
        <ellipse id="cheekL" cx="65" cy="120" rx="10" ry="7" fill="#ff9fb3" opacity="0.6"/>
        <ellipse id="cheekR" cx="135" cy="120" rx="10" ry="7" fill="#ff9fb3" opacity="0.6"/>
        <!-- eyes -->
        <g id="eyes">
          <ellipse cx="78" cy="102" rx="7" ry="9" fill="#3a2a20"/>
          <ellipse cx="122" cy="102" rx="7" ry="9" fill="#3a2a20"/>
        </g>
        <!-- mouth -->
        <path id="mouth" d="M 80 132 Q 100 140 120 132" stroke="#a5453f" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- hair front strands -->
        <path d="M 30 90 Q 40 30 100 25 Q 160 30 170 90 Q 150 60 100 55 Q 50 60 30 90 Z" fill="#5b3a29"/>
        <!-- kurdele -->
        <circle cx="140" cy="55" r="9" fill="var(--pink)"/>
      </svg>
    </div>

    <div class="bar-label">
      <span>Affection Level</span>
      <span id="levelName">Getting to know you</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>

    <div class="stats">
      <div>Hearts Sent <span id="heartCount">0</span></div>
      <div>Level <span id="levelNum">1</span></div>
    </div>

    <button id="sendBtn">💗 Send a Heart</button>
    <div class="msg" id="msg"></div>

    <footer>a small GitHub project · single-file index.html</footer>
  </div>

<script>
(function () {
  const HEARTS_PER_LEVEL = 10;
  const LEVEL_NAMES = ["Getting to know you", "Friendship", "Closeness", "Trust", "Happiness", "Full of Love"];
  const REACTIONS = [
    "Hi there! 👋",
    "That was nice ✨",
    "I'm smiling 😊",
    "Today is going great 💫",
    "I trust you 🥰",
    "I'm so happy! 💖"
  ];

  let hearts = 0;
  let level = 1;

  const heartCountEl = document.getElementById("heartCount");
  const levelNumEl = document.getElementById("levelNum");
  const levelNameEl = document.getElementById("levelName");
  const barFillEl = document.getElementById("barFill");
  const avatarEl = document.getElementById("avatar");
  const mouthEl = document.getElementById("mouth");
  const msgEl = document.getElementById("msg");
  const gameEl = document.getElementById("game");
  const sendBtn = document.getElementById("sendBtn");

  function updateFace() {
    // smile grows bigger as level increases
    const curve = 130 + Math.min(level, 6) * 4;
    mouthEl.setAttribute("d", `M 80 132 Q 100 ${curve} 120 132`);
  }

  function updateUI() {
    const progressInLevel = hearts % HEARTS_PER_LEVEL;
    const pct = (progressInLevel / HEARTS_PER_LEVEL) * 100;
    heartCountEl.textContent = hearts;
    levelNumEl.textContent = level;
    levelNameEl.textContent = LEVEL_NAMES[Math.min(level - 1, LEVEL_NAMES.length - 1)];
    barFillEl.style.width = pct + "%";
    updateFace();
  }

  function spawnFlyingHeart() {
    const heart = document.createElement("div");
    heart.className = "heart-fly";
    heart.textContent = "💗";
    heart.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
    gameEl.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
  }

  sendBtn.addEventListener("click", () => {
    hearts++;
    if (hearts % HEARTS_PER_LEVEL === 0) {
      level = Math.min(level + 1, LEVEL_NAMES.length);
    }
    spawnFlyingHeart();
    avatarEl.classList.remove("bounce");
    void avatarEl.offsetWidth; // reset animation via reflow
    avatarEl.classList.add("bounce");
    msgEl.textContent = REACTIONS[Math.min(level - 1, REACTIONS.length - 1)];
    updateUI();
  });

  updateUI();
})();
</script>
</body>
</html>
